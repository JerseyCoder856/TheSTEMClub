<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Workspace — The STEM Club</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/brand.css"></head><body><nav class="navbar"><a href="/" class="logo"><img src="/m.png" alt="The STEM Club"></a></nav><main class="portal-shell"><p data-portal-message class="portal-message" role="status" aria-live="polite"></p><section class="page-heading"><div><p class="portal-kicker">Events & Attendance</p><h1>Scan Member QR Code</h1><p>Choose the event once, then keep checking in members.</p></div></section><section class="scanner-workspace" data-scanner-workflow><article class="portal-card scanner-controls"><label class="portal-form">Event<select data-scan-event required></select></label><button class="btn-pill-green scanner-button" data-start-scan>▦ Start camera</button><div class="scanner-actions"><button data-pause-scan>Pause</button><button data-switch-camera>Switch camera</button><button data-close-scan>Close scanner</button></div><div id="reader" hidden></div><div class="scan-result" data-scan-result hidden aria-live="assertive"></div></article><article class="portal-card"><h2>Manual check-in</h2><p>Use this if camera access is unavailable.</p><form class="portal-form" data-manual-form><label>Member<select data-manual-member required></select></label><button class="btn-pill-green">Check in member</button></form></article><article class="portal-card attendance-live"><h2>Attendance · <span data-attendance-count>0</span></h2><div class="compact-list" data-attendance-live><p class="empty-state">No one is checked in yet.</p></div></article></section><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/portal-config.js?v=20260829-workspace-1"></script><script src="
