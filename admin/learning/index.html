<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The STEM Club Passport Admin</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/brand.css"></head><body><nav class="navbar"><a href="/" class="logo"><img src="/m.png" alt="The STEM Club"></a><ul class="nav-links"><li><a href="/my-passport">My Passport</a></li><li><button data-logout class="btn-pill-outline-dark">Log Out</button></li></ul></nav><main class="portal-shell"><nav class="admin-nav" aria-label="Administration"><a href="/admin">Overview</a><a href="/admin/members">Members</a><a href="/admin/attendance">Attendance</a><a href="/admin/events">Events</a><a href="/admin/points">Points</a><a href="/admin/badges">Badges</a><a href="/admin/learning">Learning</a><a href="/admin/community">Moderation</a><a href="/admin/recognitions">Recognitions</a><a href="/admin/outreach">Outreach</a><a href="/admin/audit">Audit</a><a href="/admin/settings">Settings</a></nav><p data-portal-message class="portal-message" role="status" aria-live="polite"></p>
<section class="portal-hero"><p class="portal-kicker">Learning content</p><h1>Courses, modules & lessons</h1><p>Draft, preview, publish, and organize approachable STEM learning journeys.</p></section><section class="portal-grid portal-grid--two"><div data-admin-courses></div><article class="portal-card"><h2>Create course</h2><form class="portal-form" data-course-form><label>Title<input name="title" required maxlength="160"></label><label>URL slug<input name="slug" required pattern="[a-z0-9-]+"></label><label>Summary<textarea name="summary" required></textarea></label><label>Access<select name="access_level"><option value="all_members">All members</option><option value="active_members">Active memberships only</option></select></label><label><input type="checkbox" name="published"> Publish now</label><button class="btn-pill-green">Create course</button></form></article></section><section class="portal-grid portal-grid--two" style="margin-top:24px"><article class="portal-card"><h2>Add module</h2><form class="portal-form" data-module-form><label>Course<select name="course_id" data-course-select required></select></label><label>Module title<input name="title" required></label><label>Position<input name="position" type="number" value="0"></label><label><input type="checkbox" name="published"> Published</label><button class="btn-pill-green">Add module</button></form></article><article class="portal-card"><h2>Add lesson</h2><form class="portal-form" data-lesson-form><label>Module<select name="module_id" data-module-select required></select></label><label>Lesson title<input name="title" required></label><label>Lesson text<textarea name="content"></textarea></label><label>Project instructions<textarea name="project_instructions"></textarea></label><label>YouTube or Vimeo URL<input name="video_url" type="url"></label><label>Position<input name="position" type="number" value="0"></label><label><input type="checkbox" name="published"> Published</label><button class="btn-pill-green">Add lesson</button></form></article><article class="portal-card"><h2>Add resource</h2><form class="portal-form" data-resource-form><label>Lesson<select name="lesson_id" data-lesson-select required></select></label><label>Title<input name="title" required></label><label>HTTPS resource URL<input name="resource_url" type="url" required></label><label>Type<select name="resource_type"><option>link</option><option>download</option><option>worksheet</option><option>project</option></select></label><button class="btn-pill-green">Add resource</button></form></article></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/portal-config.js"></script><script src="/portal.js"></script><script src="/main.js"></script></body></html>
