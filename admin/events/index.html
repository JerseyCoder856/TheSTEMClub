<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/portal.css"><title>The STEM Club Passport Admin</title></head><body><nav class="navbar"><a href="/" class="logo"><img src="/m.png" alt="The STEM Club"></a><ul class="nav-links"><li><a href="/my-passport">My Passport</a></li><li><button data-logout class="btn-pill-outline-dark">Log Out</button></li></ul></nav><main class="portal-shell"><nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/members">Members</a><a href="/admin/attendance">Check-In</a><a href="/admin/events">Workshops</a><a href="/admin/badges">Badges</a></nav><p data-portal-message class="portal-message"></p>
